name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: SITE_BASE=/prism-ui/ bun run --cwd apps/site build
      - run: bun run --cwd apps/playground build --base /prism-ui/playground/ --outDir ../site/dist/playground --emptyOutDir
      - run: bun run --cwd apps/site integrate-playground
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
