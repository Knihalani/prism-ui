<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism inline artifacts</title>
<link rel="stylesheet" href="./harness.css">
<style>
  body { margin:0; }
  .harness-page { min-height:100vh; padding:32px max(20px,calc((100vw - 820px)/2)) 48px; background:var(--prism-bg); color:var(--prism-text); font:var(--prism-text-base)/1.5 var(--prism-font-body); }
  .harness-header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .harness-header h1 { font-size:28px; margin:0; letter-spacing:-.055em; }
  .harness-header nav { display:flex; gap:6px; flex-wrap:wrap; }
  .harness-header button { font:inherit; font-size:12px; padding:5px 9px; background:var(--prism-surface); color:var(--prism-text); border:1px solid var(--prism-border); border-radius:var(--prism-radius-sm); cursor:pointer; }
</style>
<div id="root"></div>
<script type="module" src="./harness.js"></script>
</html>
